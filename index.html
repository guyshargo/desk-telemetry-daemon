<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .dashboard-card {
            background: #1e1e1e;
            padding: 2rem 4rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }
        #source {
            font-size: 1rem;
            color: #00e676;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        #title {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
        }
        #artist {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div id="source">WAITING FOR DATA...</div>
        <h1 id="title"></h1>
        <h2 id="artist"></h2>
    </div>

    <script>
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${protocol}//${window.location.host}/ws`;
        
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            console.log("WebSocket Connected!");
        };

        // This executes when a JSON event is pushed
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Update the DOM elements with the new data
            if (data.source) document.getElementById('source').innerText = data.source;
            if (data.title) document.getElementById('title').innerText = data.title;
            if (data.artist) document.getElementById('artist').innerText = data.artist;
        };

        socket.onclose = () => {
            document.getElementById('source').innerText = "DISCONNECTED";
            document.getElementById('source').style.color = "#ff1744";
        };
    </script>
</body>
</html>
